<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMT WIL CENTER · Admin</title>
<style>body{margin:0;background:#101a28;color:#f1f1e8;font:16px system-ui,sans-serif}main{max-width:760px;margin:8vh auto;padding:28px;background:#182536;border:1px solid #314359}h1{color:#78e0bb;font-size:28px}p{line-height:1.7;color:#c3cfdb}.card{padding:14px;background:#111e2c;margin:12px 0;border-left:3px solid #78e0bb}a,button{color:#78e0bb}button{background:#25394d;border:1px solid #476178;padding:10px 14px;cursor:pointer}#status{font-weight:700}</style>
<main><p>CAMT WIL CENTER · ADMIN</p><h1>Site status</h1><div class="card">Application: <strong>Plenoi Get Job</strong><br>Deployment: <span id="status">Checking…</span></div><p>This game is a static browser application. CV files and player profiles stay in the browser; there is no database or server-side CV storage.</p><p><a href="../">Open the game</a></p><button id="refresh">Check status</button></main>
<script>async function check(){const s=document.querySelector('#status');s.textContent='Checking…';try{const r=await fetch('../healthz',{cache:'no-store'});s.textContent=r.ok?'Online':'Unavailable'}catch{s.textContent='Unavailable'}}document.querySelector('#refresh').onclick=check;check()</script></html>
